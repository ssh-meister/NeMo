defaults:
  - easy_magpietts_lhotse
  - _self_

name: ${oc.env:EXP_NAME}

model:
  use_speaker_encoder: true
  train_shuffle_context_embedding_prob: 0.1
  disable_lm_text_head: true
  disable_subword_embedding: true
  use_bpe_char_tokenizer: true

  phoneme_tokenizer:
    tokenizer_path: /model_artifacts/tokenizers/bpe_ipa_tokenizer_2048_en_de_es_fr_hi_it_vi_zh_ko-KR_pt-BR_ar.json

  decoder_type: nemotron_h
  nemotron_h_config:
    n_routed_experts: 24
    num_experts_per_tok: 4
    moe_intermediate_size: 768
    hybrid_override_pattern: "MEMEM*EMEMEM*EMEMEMEM*EMEMEMEME"
    num_hidden_layers: 31
    residual_in_fp32: false

  training_modes:
    - text_input_mode: streaming
      streaming_phonemes_delay: 3
      streaming_speech_delay: 5
  ignore_phoneme_languages: [vi, zh, ja, ko-KR, hi]
  add_language_to_context_text: true

  train_ds:
    dataset:
      batch_duration: 100
      max_duration: 40.0
      bucket_duration_bins: ${oc.decode:${oc.env:BUCKET_DURATION_BINS}}
      num_workers: 1
      input_cfg: ${oc.env:MANIFEST_ROOT}/train_all.yaml
      bucket_buffer_size: 10000
      shuffle_buffer_size: 10000

  validation_ds:
    dataset:
      _target_: nemo.collections.tts.data.text_to_speech_dataset.MagpieTTSDataset
      min_duration: 0.2
      max_duration: 20.0
      dataset_meta:
        my_val_data:
          manifest_path: /data/TTS/manifests/dev_clean_withContextAudio_604samples_ipa_filtered.json
          audio_dir: /data/TTS/LibriTTS
          tokenizer_names: [nemotron_nano_30b]
        de_val_data:
          manifest_path: /data/TTS/CML/manifests_with_codecs/cml_tts_dataset_german_v0.1/dev_100subset_ipa.json
          audio_dir: /data/TTS/CML/cml_tts_dataset_german_v0.1
          tokenizer_names: [nemotron_nano_30b]
        es_val_data:
          manifest_path: /data/TTS/CML/manifests_with_codecs/cml_tts_dataset_spanish_v0.1/dev_100subset_ipa.json
          audio_dir: /data/TTS/CML/cml_tts_dataset_spanish_v0.1
          tokenizer_names: [nemotron_nano_30b]
        fr_val_data:
          manifest_path: /data/TTS/CML/manifests_with_codecs/cml_tts_dataset_french_v0.1/dev_100subset_ipa.json
          audio_dir: /data/TTS/CML/cml_tts_dataset_french_v0.1
          tokenizer_names: [nemotron_nano_30b]
        it_val_data:
          manifest_path: /data/TTS/CML/manifests_with_codecs/cml_tts_dataset_italian_v0.1/dev_100subset_ipa.json
          audio_dir: /data/TTS/CML/cml_tts_dataset_italian_v0.1
          tokenizer_names: [nemotron_nano_30b]
        hi_val_data:
          manifest_path: /data/TTS/evaluation_manifests/hindi_100subset_basic_ipa.json
          audio_dir: /data/TTS/Hindi
          tokenizer_names: [nemotron_nano_30b]
        zh_val_data:
          manifest_path: /data/TTS/evaluation_manifests/zh_riva_100subset_ipa.json
          audio_dir: /data/TTS/riva/zh
          tokenizer_names: [nemotron_nano_30b]
        vi_val_data:
          manifest_path: /data/TTS/evaluation_manifests/vi_100subset_test_ipa.json
          audio_dir: /data/TTS/VietnameseEvaluationData/vi
          tokenizer_names: [nemotron_nano_30b]
    dataloader_params:
      batch_size: 16
      num_workers: 2
      pin_memory: true

  cfg_unconditional_prob: 0.05
  run_val_inference: true
  use_multilingual_asr: true
  speaker_verification_model_path: /model_artifacts/speakerverification_en_titanet_large.nemo
  context_duration_min: 3.0
  context_duration_max: 10.0
  codecmodel_path: /model_artifacts/25fps_spectral_codec_with_bandwidth_extension.nemo

  vector_quantizer:
    _target_: nemo.collections.tts.modules.audio_codec_modules.GroupFiniteScalarQuantizer
    num_groups: 8
    num_levels_per_group: [4, 4, 4, 4, 4]

  optim:
    lr: 2e-4
  load_cached_codes_if_available: true

trainer:
  max_steps: 1000000
  devices: 8
  num_nodes: ${oc.decode:${oc.env:SLURM_JOB_NUM_NODES}}
  limit_train_batches: 3000
  val_check_interval: 3000

exp_manager:
  explicit_log_dir: ${oc.env:EXP_DIR}
  max_time_per_run: 00:03:50:00
  create_tensorboard_logger: false
  create_wandb_logger: true
  wandb_logger_kwargs:
    entity: aiapps
    project: 2608_EasyMagpie
    name: ${oc.env:EXP_NAME}
    resume: true
  version: 0
